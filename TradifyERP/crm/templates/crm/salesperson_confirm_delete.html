{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Sales Person - CRM{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="page-title-box">
        <div class="row align-items-center">
            <div class="col-md-8"><h4 class="page-title mb-0">Delete Sales Person</h4></div>
            <div class="col-md-4 text-right"><a href="{% url 'crm:salespersons' %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a></div>
        </div>
    </div>
    <div class="row"><div class="col-lg-6 mx-auto"><div class="card border-danger"><div class="card-header bg-danger text-white"><h5 class="card-title mb-0"><i class="fas fa-exclamation-triangle"></i> Confirm</h5></div><div class="card-body">
        <div class="alert alert-warning"><strong>Warning!</strong> Cannot be undone.</div>
        <div class="card mb-3 bg-light"><div class="card-body"><p class="mb-0"><strong>{{ object.salesperson_name }}</strong></p></div></div>
        <form method="post">{% csrf_token %}<div class="form-group"><div class="custom-control custom-checkbox"><input type="checkbox" class="custom-control-input" id="confirm" name="confirm" required><label class="custom-control-label" for="confirm">Delete this sales person.</label></div></div><button type="submit" class="btn btn-danger btn-block"><i class="fas fa-trash"></i> Delete</button></form>
        <a href="{% url 'crm:salespersons' %}" class="btn btn-secondary btn-block mt-2"><i class="fas fa-times"></i> Cancel</a>
    </div></div></div></div>
</div>
{% endblock %}
