{% extends 'base.html' %}
{% block title %}Delete Contract - CRM{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="page-title-box"><h4 class="page-title mb-4">Delete Contract</h4></div>
    <div class="alert alert-danger"><strong><i class="fas fa-exclamation-triangle"></i> Warning!</strong> This action cannot be undone.</div>
    <div class="card card-body mb-3">
        <p><strong>Contract #:</strong> {{ object.contract_number }}</p>
        <p><strong>Status:</strong> {{ object.status }}</p>
    </div>
    <form method="post">{% csrf_token %}
        <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="confirm_delete" name="confirm_delete"> <label class="form-check-label">I understand this contract will be permanently deleted</label></div>
        <button type="submit" class="btn btn-danger" id="delete_btn" disabled><i class="fas fa-trash"></i> Delete Contract</button>
        <a href="{% url 'crm:contract_detail' object.id %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancel</a>
    </form>
</div>
<script>document.getElementById('confirm_delete').addEventListener('change', function() { document.getElementById('delete_btn').disabled = !this.checked; });</script>
{% endblock %}
