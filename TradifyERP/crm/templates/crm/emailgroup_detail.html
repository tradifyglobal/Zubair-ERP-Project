{% extends 'base.html' %}
{% block title %}Email Group Details - CRM{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="page-title-box"><div class="row align-items-center"><div class="col-md-8"><h4 class="page-title">{{ object.group_name }}</h4></div><div class="col-md-4 text-right"><a href="{% url 'crm:email-groups' %}" class="btn btn-sm btn-secondary"><i class="fas fa-arrow-left"></i></a> <a href="{% url 'crm:emailgroup_update' object.id %}" class="btn btn-sm btn-primary"><i class="fas fa-edit"></i></a> <a href="{% url 'crm:emailgroup_delete' object.id %}" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></a></div></div></div>
    <div class="row"><div class="col-lg-8"><div class="card"><div class="card-body">
        <h5 class="card-title mb-3">Group Information</h5>
        <div class="row mb-3"><div class="col-md-12"><strong>Group Name:</strong><br>{{ object.group_name }}</div></div>
        {% if object.description %}<div class="row"><div class="col-md-12"><strong>Description:</strong><br><p class="text-muted">{{ object.description }}</p></div></div>{% endif %}
    </div></div></div></div>
</div>
{% endblock %}
