# Nginx configuration for TradifyERP with Let's Encrypt SSL
# Place this file in: C:\nginx\conf\nginx.conf
# Or include it from main nginx.conf: include sites-enabled/tradifyglobal.conf;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.tradifyglobal.com tradifyglobal.com;

    # Let's Encrypt verification directory
    location /.well-known/acme-challenge/ {
        root C:\nginx\html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tradifyglobal.com tradifyglobal.com;

    # SSL Certificate paths (from Let's Encrypt)
    ssl_certificate "C:\letsencrypt\live\tradifyglobal.com\fullchain.pem";
    ssl_certificate_key "C:\letsencrypt\live\tradifyglobal.com\privkey.pem";
    ssl_trusted_certificate "C:\letsencrypt\live\tradifyglobal.com\chain.pem";

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log C:\nginx\logs\tradifyglobal_access.log;
    error_log C:\nginx\logs\tradifyglobal_error.log;

    # Client upload size limit
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Root location - proxy to Gunicorn
    location / {
        # Proxy settings
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        # Connection
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 24 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 2048m;
        proxy_temp_file_write_size 32k;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files (Django)
    location /static/ {
        alias C:/TradifyERP/TradifyERP/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (User uploads)
    location /media/ {
        alias C:/TradifyERP/TradifyERP/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }

    # Favicon and robots.txt
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
