{% extends 'base.html' %}
{% load permission_tags %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row mb-3">
        <div class="col"><h1 class="h3">{{ title }}</h1></div>
        <div class="col text-end">
            <a href="{{ edit_url }}" class="btn btn-warning"><i class="fas fa-edit"></i> Edit</a>
            {% if user|has_action_permission:'maintenance:delete' %}
            <a href="{{ delete_url }}" class="btn btn-danger" onclick="return confirm('Are you sure?')"><i class="fas fa-trash"></i> Delete</a>
            {% endif %}
            <a href="{{ list_url }}" class="btn btn-secondary">Back</a>
        </div>
    </div>
    <div class="card">
        <div class="card-body">
            {{ content|safe }}
        </div>
    </div>
</div>
{% endblock %}
