{% extends "base.html" %}
{% load static %}
{% block title %}Delete Audit{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-6 offset-lg-3">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white"><h5 class="mb-0">Delete Audit</h5></div>
                <div class="card-body">
                    <div class="alert alert-warning"><i data-feather="alert-triangle"></i> This action cannot be undone!</div>
                    <p>Are you sure you want to delete this audit record?</p>
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger"><i data-feather="trash-2"></i> Delete</button>
                            <a href="{% url 'maintenance:audit-list' %}" class="btn btn-secondary"><i data-feather="x"></i> Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/feather.min.js' %}"></script>
<script>feather.replace();</script>
{% endblock %}
